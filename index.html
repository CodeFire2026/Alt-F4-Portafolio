<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio ALT+F4</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Expletus+Sans:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">

    <!-- Stylesheets (el orden importa!) -->
    <link rel="stylesheet" href="src/css/variables.css">
    <link rel="stylesheet" href="src/css/base.css">
    <link rel="stylesheet" href="src/css/nav-button.css">
    <link rel="stylesheet" href="src/css/theme-toggle.css">
    <link rel="stylesheet" href="src/css/menu.css">

    <!-- Prevent screen flash on load -->
    <script>
        var saved = localStorage.getItem("theme");
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
    </script>
</head>

<body>
    <header>

        </a>
        <nav class="head-nav-container" id="menu-card">
            <div class="button-wrapper">
                <a class="shine-button button-chrome" href="#">Sobre nosotros</a>
            </div>
            <div class="button-wrapper">
                <a class="shine-button button-chrome" href="#">Proyectos</a>
            </div>
            <div class="button-wrapper">
                <a class="shine-button button-chrome" href="#">Contactos</a>
            </div>
            <button class="theme-btn" data-theme-toggle type="button" aria-label="Switch to dark mode">
                <svg class="theme-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="5" />
                    <line x1="12" y1="1" x2="12" y2="3" />
                    <line x1="12" y1="21" x2="12" y2="23" />
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                    <line x1="1" y1="12" x2="3" y2="12" />
                    <line x1="21" y1="12" x2="23" y2="12" />
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                </svg>

                <svg class="theme-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
        </nav>
        <button class="menu-trigger" id="menu02" type="button" aria-expanded="false" aria-controls="menu-card">
            <!-- Estas tres son las lineas de la hamburgesa -->
            <span></span>

    <script src="src/js/menu-toggle.js"></script>
    <script src="src/js/theme-toggle.js"></script>
</body>

</html>
